<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Order | Automotive Order Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="createOrder.js" defer></script>
</head>
<body>
    
    <main>
        <header class="brand-header">
            <img src="brand-mark.svg" alt="Automotive Order Management logo">
            <div><h1>Create New Order</h1><p>Parts and customer details</p></div>
        </header>

        <form id="orderForm">

            <fieldset>
                <legend>Order Information</legend>

                <label for="orderId">Order ID</label>
                <input type="text" id="orderId" name="orderId" required>

            </fieldset>

            <fieldset>
                <legend>Customer Information</legend>

                <label for="customerName">Full Name</label>
                <input type="text" id="customerName" name="name" required>

                <label for="address">Address</label>
                <input type="text" id="address" name="address" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" required>
            </fieldset>

            <fieldset>
                <legend>Products</legend>

                    <div>                
                        <label>
                            <input type="checkbox" name="product" value="TIR-001">
                            Car Tire - €95.00
                        </label>
                        <input type="number" class="quantity" min="1" step="1" value="1" disabled aria-label="Car Tire quantity">
                    </div>

                    <div>
                        <label>
                            <input type="checkbox" name="product" value="WHE-002">
                            Alloy Wheel - €150.00
                        </label>
                        <input type="number" class="quantity" min="1" step="1" value="1" disabled aria-label="Alloy Wheel quantity">
                    </div>

                    <div>
                        <label>
                            <input type="checkbox" name="product" value="BAT-003">
                            Car Battery - €120.00
                        </label>
                        <input type="number" class="quantity" min="1" step="1" value="1" disabled aria-label="Car Battery quantity">
                    </div>

                    <div>
                        <label>
                            <input type="checkbox" name="product" value="BRK-004">
                            Brake Disc - €65.00
                        </label>
                          <input type="number" class="quantity" min="1" step="1" value="1" disabled aria-label="Brake Disc quantity">
                    </div>

            </fieldset>

            <button type="submit" id="submitButton">
                Save Order
            </button>

        </form>

        <p id="result" role="status" aria-alive="polite"></p>

        
        <nav aria-label="Navigation">
            <p>
                <a href="operations.html">Back to Operations</a>
            </p>

            <p>
                <a href="index.html">Back to Home</a>
            </p>
        </nav>

    </main>

</body>
</html>
