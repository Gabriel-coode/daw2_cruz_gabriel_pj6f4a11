
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations | Automotive Order Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="operations.js" defer></script>
</head>
<body>

    <main>
        <header class="brand-header">
            <img src="brand-mark.svg" alt="Automotive Order Management logo">
            <div><h1>Operations Menu</h1><p>Order management workspace</p></div>
        </header>

        <p id="sessionMessage" role="status">
            Checking authentication...
        </p>

        <section id="operationsContent" hidden>

            <p id="welcomeMessage"></p>

            <form id="operationsForm">

                <fieldset>
                    <legend>Select an Operation</legend>

                    <label>
                        <input
                            type="radio"
                            name="operation"
                            value="create"
                            checked
                        >
                        Create New Order
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="operation"
                            value="view"
                        >
                        View Orders
                    </label>
                </fieldset>

                <button type="submit">
                    Access Selected Operation
                </button>

            </form>

            <form id="logoutForm">
                <button type="submit">Logout</button>
            </form>

        </section>

        <nav aria-label="Navigation">
            <a href="index.html">Back to Home</a>
        </nav>

    </main>

</body>
</html>
